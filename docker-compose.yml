services:
  # Creates the dedicated Supabase schema before Nakama migrations run.
  # Uses DIRECT_URL because schema DDL should avoid the PgBouncer pooler.
  nakama-schema:
    image: postgres:15-alpine
    environment:
      DIRECT_URL: ${DIRECT_URL:?DIRECT_URL is required}
      NAKAMA_DB_SCHEMA: ${NAKAMA_DB_SCHEMA:-nakama}
    command:
      - sh
      - -ec
      - |
        : "$${DIRECT_URL:?DIRECT_URL is required}"
        : "$${NAKAMA_DB_SCHEMA:=nakama}"
        psql "$${DIRECT_URL}" \
          -v ON_ERROR_STOP=1 \
          -c "CREATE SCHEMA IF NOT EXISTS \"$${NAKAMA_DB_SCHEMA}\";"

  nakama:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      nakama-schema:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      # Render sets PORT dynamically; local compose keeps Nakama on the
      # standard client API port and console on the standard console port.
      PORT: ${PORT:-7350}
      NAKAMA_CONSOLE_PORT: ${NAKAMA_CONSOLE_PORT:-7351}
      NAKAMA_DB_SCHEMA: ${NAKAMA_DB_SCHEMA:-nakama}
      NAKAMA_SERVER_KEY: ${NAKAMA_SERVER_KEY:?NAKAMA_SERVER_KEY is required}
      NAKAMA_RUNTIME_HTTP_KEY: ${NAKAMA_RUNTIME_HTTP_KEY:?NAKAMA_RUNTIME_HTTP_KEY is required}
      NAKAMA_SESSION_ENCRYPTION_KEY: ${NAKAMA_SESSION_ENCRYPTION_KEY:?NAKAMA_SESSION_ENCRYPTION_KEY is required}
      NAKAMA_REFRESH_ENCRYPTION_KEY: ${NAKAMA_REFRESH_ENCRYPTION_KEY:?NAKAMA_REFRESH_ENCRYPTION_KEY is required}
      NAKAMA_CONSOLE_USERNAME: ${NAKAMA_CONSOLE_USERNAME:-admin}
      NAKAMA_CONSOLE_PASSWORD: ${NAKAMA_CONSOLE_PASSWORD:?NAKAMA_CONSOLE_PASSWORD is required}
      NAKAMA_CONSOLE_SIGNING_KEY: ${NAKAMA_CONSOLE_SIGNING_KEY:?NAKAMA_CONSOLE_SIGNING_KEY is required}
    volumes:
      - ./data/modules:/nakama/data/modules:ro
    ports:
      - "${PORT:-7350}:${PORT:-7350}"
      - "${NAKAMA_CONSOLE_PORT:-7351}:${NAKAMA_CONSOLE_PORT:-7351}"
